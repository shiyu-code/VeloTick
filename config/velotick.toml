[log]
# 是否开启清洗后 Tick 的 CSV 日志（默认 false）
enable = false
# 日志文件路径（相对项目根目录）
path = "logs/clean.csv"
# VeloTick marker
[ctp]
# 是否启用CTP引擎（默认false；启用前需准备库与账号）
use_ctp = false
# 连接参数占位（启用后请按实际环境填写）
front = "tcp://180.168.146.187:10131"
broker = "9999"
investor = "your_investor"
password = "your_pwd"
# 订阅合约列表
instruments = ["RB2501", "HC2501"]

[ws]
port = 8080

[redis]
host = "127.0.0.1"
port = 6379
# VeloTick marker